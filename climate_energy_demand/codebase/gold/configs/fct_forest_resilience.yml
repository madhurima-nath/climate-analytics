# Target Table Configuration
table_name: "fct_forest_resilience_annual"
transformation_module: "src.transforms.nature"
transformation_function: "process_forest_resilience"

# Source Mapping (Silver Layer)
sources:
  forest_source: "climate_energy_demand.silver.forest_carbon_annual"
  weather_source: "climate_energy_demand.silver.weather_historical"
  h3_dim_source: "climate_energy_demand.silver.dim_h3_grid"

# Performance Optimization
partition_by:
  - "year"
z_order_columns:
  - "h3_cell_index"

# Semantic Metadata (For AI/BI Genie Discovery)
description: "High-resolution spatial table mapping forest carbon sequestration health against cumulative annual climate stressors (heat and drought) at an H3 Resolution 6 grain."
columns:
  - name: "h3_cell_index"
    comment: "Uber H3 Resolution 6 hexagonal spatial identifier."
  - name: "year"
    comment: "Calendar year of observation."
  - name: "carbon_net_flux"
    comment: "Net greenhouse gas flux (Mg CO2e/ha). Negative values indicate a carbon sink; positive values indicate a carbon source."
  - name: "forest_area_ha"
    comment: "Total hectares of forest cover within the H3 cell."
  - name: "sequestration_efficiency"
    comment: "Calculated metric: Net carbon flux normalized by forest area. Measures the sequestration 'productivity' of the land."
  - name: "extreme_heat_days_count"
    comment: "Annual count of days where local temperatures exceeded the 95th percentile climatological baseline (WMO standard)."
  - name: "max_consecutive_dry_days"
    comment: "The longest period of zero precipitation in the year; used as a high-fidelity proxy for localized drought stress."
  - name: "tree_cover_loss_ha"
    comment: "Total forest area lost within the year due to disturbances or climate stress."
  - name: "centroid_lat"
    comment: "Latitude coordinate of the H3 cell center."
  - name: "centroid_lon"
    comment: "Longitude coordinate of the H3 cell center."