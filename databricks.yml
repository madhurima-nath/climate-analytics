bundle:
  name: climate_energy_demand

variables:
  warehouse_id:
    description: "SQL Warehouse ID for SQL tasks"
    default: ""

resources:
  jobs:
    # === ONE-TIME BOOTSTRAP (run once before any pipeline) ===
    # Creates catalog, schemas, audit tables, and monitoring tables.
    # Idempotent (uses IF NOT EXISTS) but should only be run once at project init.
    project_bootstrap:
      name: "Project: Infrastructure Bootstrap"
      tasks:
        - task_key: create_catalog_and_schemas
          sql_task:
            file:
              path: "./setup/project_infrastructure.sql"
            warehouse_id: "${var.warehouse_id}"

        - task_key: create_monitoring_tables
          depends_on:
            - task_key: create_catalog_and_schemas
          sql_task:
            file:
              path: "./pipelines/consumption/monitoring/setup.sql"
            warehouse_id: "${var.warehouse_id}"

        - task_key: create_silver_audit
          depends_on:
            - task_key: create_catalog_and_schemas
          sql_task:
            file:
              path: "./pipelines/silver/setup_silver.sql"
            warehouse_id: "${var.warehouse_id}"

        - task_key: create_gold_audit
          depends_on:
            - task_key: create_catalog_and_schemas
          sql_task:
            file:
              path: "./pipelines/gold/setup_gold.sql"
            warehouse_id: "${var.warehouse_id}"

        - task_key: verify_and_log
          depends_on:
            - task_key: create_monitoring_tables
            - task_key: create_silver_audit
            - task_key: create_gold_audit
          sql_task:
            file:
              path: "./setup/verify_bootstrap.sql"
            warehouse_id: "${var.warehouse_id}"

    # === MODULAR BRONZE LAYER JOB ===
    # Bronze is manual (files uploaded to raw_uploads volume, then ingested via notebooks)
    # This validation checks data existence, freshness (7-day threshold), and volume completeness.
    bronze_validation:
      name: "Bronze: Data Validation"
      tasks:
        - task_key: run_validation_tests
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "bronze"
              task_key: "run_validation_tests"

    # === MODULAR SILVER LAYER JOBS ===
    # Run independently or chain together as needed
    # Requires: project_bootstrap has been run at least once

    # Silver Data Load (run when you have new/updated Bronze data)
    silver_data_load:
      name: "Silver: Data Load"
      timeout_seconds: 0
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: run_orchestrator
          notebook_task:
            notebook_path: "./pipelines/silver/silver_orchestrator.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "silver"
              task_key: "run_orchestrator"

    # Silver Validation (run independently, checks for data changes)
    silver_validation:
      name: "Silver: Data Validation"
      tasks:
        - task_key: run_validation_tests
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "silver"
              task_key: "run_validation_tests"

    # === MODULAR GOLD LAYER JOBS ===
    # Run independently or chain together as needed
    # Requires: project_bootstrap has been run at least once

    # Gold Data Load (run when silver data is updated)
    gold_data_load:
      name: "Gold: Data Load"
      timeout_seconds: 0
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: run_orchestrator
          notebook_task:
            notebook_path: "./pipelines/gold/gold_orchestrator.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "gold"
              task_key: "run_orchestrator"

    # Gold Validation (run independently, validates gold layer data quality)
    gold_validation:
      name: "Gold: Data Validation"
      tasks:
        - task_key: run_validation_tests
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "gold"
              task_key: "run_validation_tests"

    # === FULL PIPELINE (chains all layers end-to-end) ===
    # Assumes project_bootstrap has already been run.
    # Use this for CI/CD or complete end-to-end runs
    climate_data_pipeline:
      name: "Climate Data Pipeline (Full)"
      timeout_seconds: 0
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: validate_bronze_data
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "bronze"
              task_key: "validate_bronze_data"
          run_if: ALL_DONE  # Non-blocking: flag stale bronze without stopping the pipeline

        - task_key: load_silver_data
          depends_on:
            - task_key: validate_bronze_data
          run_if: ALL_DONE  # Run even if bronze validation flags stale data
          notebook_task:
            notebook_path: "./pipelines/silver/silver_orchestrator.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "silver"
              task_key: "load_silver_data"

        - task_key: validate_silver_data
          depends_on:
            - task_key: load_silver_data
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "silver"
              task_key: "validate_silver_data"

        # --- GOLD LAYER ---
        - task_key: load_gold_data
          depends_on:
            - task_key: validate_silver_data
          notebook_task:
            notebook_path: "./pipelines/gold/gold_orchestrator.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "gold"
              task_key: "load_gold_data"

        - task_key: validate_gold_data
          depends_on:
            - task_key: load_gold_data
          notebook_task:
            notebook_path: "./src/tests/run_all_tests_notebook.py"
            base_parameters:
              job_run_id: "{{job.run_id}}"
              job_name: "{{job.name}}"
              layer: "gold"
              task_key: "validate_gold_data"

  # === SDP PIPELINE (Silver + Gold Declarative Pipeline) ===
  # Coexists with the notebook-based jobs above. Writes to separate schemas
  # (silver_sdp, gold_sdp) to avoid table conflicts.
  # See pipeline_approaches.md for the comparison and when to use which.
  pipelines:
    silver_gold_sdp:
      name: "Climate: Silver+Gold SDP Pipeline"
      catalog: climate_energy_demand
      target: silver_sdp

      libraries:
        # glob is the unified library field; it cannot be mixed with file/notebook entries.
        - glob:
            include: ./pipelines/silver/silver_sdp.py
        - glob:
            include: ./pipelines/gold/gold_sdp.py
        - glob:
            include: ./src/transforms/**
        - glob:
            include: ./src/common/**

      serverless: true
      photon: true
      channel: current
      continuous: false

  dashboards:
    # === CLIMATE ANALYSIS DASHBOARD ===
    # The .lvdash.json file is tracked in Git at dashboard/Climate Analysis Dashboard.lvdash.json.
    # Registering it as a bundle resource enables one-command deploy (bundle deploy),
    # CI/CD integration, multi-target environment promotion, and bundle validation.
    # All SQL datasets are embedded directly in the .lvdash.json, no external SQL files needed.
    climate_monitoring:
      display_name: "Climate Analysis Dashboard"
      file_path: "./dashboard/Climate Analysis Dashboard.lvdash.json"
      warehouse_id: "${var.warehouse_id}"

targets:
  dev:
    mode: development
    workspace:
      host: "https://dbc-48f6ffe7-ea99.cloud.databricks.com"
    variables:
      warehouse_id: "051f30ffb9f184e5"