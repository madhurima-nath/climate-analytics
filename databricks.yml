bundle:
  name: climate_energy_demand

variables:
  warehouse_id:
    description: "SQL Warehouse ID for SQL tasks"
    default: ""

resources:
  jobs:
    climate_data_pipeline:
      name: "Climate and Energy Pipeline"
      timeout_seconds: 0  # 0 = no timeout (uses workspace default)
      max_concurrent_runs: 1
      queue:
        enabled: true

      tasks:
        # --- SILVER LAYER START ---
        
        - task_key: initialise_silver_infrastructure
          sql_task:
            file:
              path: "./pipelines/silver/setup_silver.sql"
            warehouse_id: "${var.warehouse_id}"


        - task_key: run_silver_orchestrator
          depends_on:
            - task_key: initialise_silver_infrastructure
          notebook_task:
            notebook_path: "./pipelines/silver/silver_orchestrator.py"


        # --- GOLD LAYER (ADD HERE LATER) ---
        # You will add your Gold task below this line later. 
        # It will 'depend_on' the run_silver_orchestrator task.

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-48f6ffe7-ea99.cloud.databricks.com
    variables:
      warehouse_id: "051f30ffb9f184e5"