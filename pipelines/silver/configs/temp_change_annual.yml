# =============================================================================
# TARGET DEFINITION
# =============================================================================
target_table: "climate_energy_demand.silver.temp_change_annual"
description: "Monthly and annual temperature change anomalies from FAO, with character encoding cleanup from bronze ISO-8859-1 ingestion."

# =============================================================================
# SOURCE MAPPING
# =============================================================================
sources:
  fao_data: "climate_energy_demand.bronze.fao_temp_change_data_noflag"

# =============================================================================
# TRANSFORMATION LOGIC
# =============================================================================
# Found in: src/transforms/nature.py
module: "nature"
function: "process_temp_change"

# =============================================================================
# STATE & INTEGRITY (For Manual Watermarking)
# =============================================================================
# Monitors the bronze table for new manual uploads.
watermark_column: "ingested_at"

# Identifies a unique record by Country, Year, Month/Season, and Element.
# Prevents duplicate entries during incremental FAO data updates.
merge_keys:
  - "country_name"
  - "year"
  - "months"
  - "element"

# =============================================================================
# PARAMETERS
# =============================================================================
params:
  start_year: 2010    # Aligning with the weather study period